packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  "@bundled-es-modules/glob": true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  nx: true
  rolldown: true
  style-dictionary: true

autoInstallPeers: false
minimumReleaseAge: 10080 # 7 days

overrides:
  esbuild: "^0.27.0"
  "@emnapi/core": "^1.7.1"
  "@emnapi/runtime": "^1.7.1"
  axios: "^1.18.0"
  style-dictionary: "^5.4.4"
  fast-uri: "^3.1.5"
  immutable: "^5.1.8"
  form-data: "^4.0.6"
  undici: "^7.29.0"
  shell-quote: "^1.9.0"
  minimatch@9: "^9.0.7"
  brace-expansion@1: "^1.1.16"
  brace-expansion@2: "^2.1.2"
  brace-expansion@5: "^5.0.7"
  js-yaml@3: "^4.3.1"
  js-yaml@4: "^4.3.1"

peerDependencyRules:
  allowedVersions:
    react: "19"
    rollup: "4"
    vite: "6 || 7"

strictPeerDependencies: true
minimumReleaseAgeExclude:
  # Renovate security update: axios@1.15.2
  - axios@1.15.2
  # Renovate security update: js-yaml@4.3.1
  - js-yaml@4.3.1
