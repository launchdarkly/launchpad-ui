packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  "@bundled-es-modules/glob": true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  nx: true
  rolldown: true
  style-dictionary: true

autoInstallPeers: false
minimumReleaseAge: 10080 # 7 days

overrides:
  esbuild: "^0.27.0"
  "@emnapi/core": "^1.7.1"
  "@emnapi/runtime": "^1.7.1"

peerDependencyRules:
  allowedVersions:
    react: "19"
    rollup: "4"
    vite: "6 || 7"

strictPeerDependencies: true
minimumReleaseAgeExclude:
  # Renovate security update: axios@1.15.2
  - axios@1.15.2
  # Renovate security update: nx@22.7.7
  - nx@22.7.7
